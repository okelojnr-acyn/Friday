name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum
      - run: go build ./...
      - run: go vet ./...

  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [crm, invoicing, projects, inventory, web3, accounting, minions]
    services:
      # Each app's conftest.py (friday_common/testing.py) migrates its
      # own "<app>_test" schema on this server at session start -- no
      # separate migration step needed here, just a reachable Postgres.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://friday:friday@localhost:5432/friday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/${{ matrix.app }}/requirements.txt -r apps/${{ matrix.app }}/requirements-dev.txt
      - run: pytest apps/${{ matrix.app }}

  pos-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # web/src/apps/pos/PosPage.tsx imports the compiled WASM engine from
      # pos-engine/ (web/src/apps/pos/engine/ -- gitignored, never
      # committed, same reason apps/*'s own generated files aren't). A
      # checkout alone never has it; build it before anything in web/
      # tries to type-check or bundle against it.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the POS WASM engine
        working-directory: pos-engine
        run: wasm-pack build --target web --out-dir ../web/src/apps/pos/engine --out-name friday_pos_engine
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm install
      - working-directory: web
        run: npx tsc --noEmit
      - working-directory: web
        run: npm run build
