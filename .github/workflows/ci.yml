name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
      - run: go build ./...
      - run: go vet ./...

  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [crm, invoicing, projects, inventory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/${{ matrix.app }}/requirements.txt -r apps/${{ matrix.app }}/requirements-dev.txt
      # Scans the whole app dir, not just tests/ -- git doesn't track empty
      # directories, so an untouched tests/ subdir wouldn't even exist
      # after a fresh checkout. Exit code 5 = "no tests collected",
      # tolerated until test files exist (tracked follow-up, see
      # ARCHITECTURE.md); any other non-zero exit still fails the job.
      - run: pytest apps/${{ matrix.app }} || [ $? -eq 5 ]

  pos-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
