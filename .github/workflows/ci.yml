name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [crm, invoicing, projects, inventory, web3, accounting, minions, fleets]
    services:
      # Each app's conftest.py (friday_common/testing.py) migrates its
      # own "<app>_test" schema on this server at session start -- no
      # separate migration step needed here, just a reachable Postgres.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://friday:friday@localhost:5432/friday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/${{ matrix.app }}/requirements.txt -r apps/${{ matrix.app }}/requirements-dev.txt
      - run: pytest apps/${{ matrix.app }}

  pos-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # web/src/apps/pos/PosPage.tsx imports the compiled WASM engine from
      # pos-engine/ (web/src/apps/pos/engine/ -- gitignored, never
      # committed, same reason apps/*'s own generated files aren't). A
      # checkout alone never has it; build it before anything in web/
      # tries to type-check or bundle against it.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the POS WASM engine
        working-directory: pos-engine
        run: wasm-pack build --target web --out-dir ../web/src/apps/pos/engine --out-name friday_pos_engine
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm install
      - working-directory: web
        run: npx tsc --noEmit
      - working-directory: web
        run: npm run build

  publish:
    # Versioned images for Friday Host (docs/FRIDAYHOST-READINESS.md, 4E in
    # friday-cloud-labs): ghcr.io/okelojnr-acyn/friday-<app>:<full sha>
    # plus :latest. Friday Host pulls these instead of building on its own
    # box, and customer VPSes pull the exact same tested image. Only after
    # every test job passed on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [kernel, apps, pos-engine, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: friday-kernel, dockerfile: infra/kernel.Dockerfile, app: "", port: "" }
          - { image: friday-crm, dockerfile: infra/python-app.Dockerfile, app: crm, port: "8001" }
          - { image: friday-invoicing, dockerfile: infra/python-app.Dockerfile, app: invoicing, port: "8002" }
          - { image: friday-projects, dockerfile: infra/python-app.Dockerfile, app: projects, port: "8003" }
          - { image: friday-inventory, dockerfile: infra/python-app.Dockerfile, app: inventory, port: "8004" }
          - { image: friday-web3, dockerfile: infra/python-app.Dockerfile, app: web3, port: "8005" }
          - { image: friday-accounting, dockerfile: infra/python-app.Dockerfile, app: accounting, port: "8006" }
          - { image: friday-minions, dockerfile: infra/python-app.Dockerfile, app: minions, port: "8007" }
          - { image: friday-fleets, dockerfile: infra/python-app.Dockerfile, app: fleets, port: "8008" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_PORT=${{ matrix.port }}
          push: true
          tags: |
            ghcr.io/okelojnr-acyn/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/okelojnr-acyn/${{ matrix.image }}:latest
          # Links the package to this public repo (visibility follows it).
          labels: |
            org.opencontainers.image.source=https://github.com/okelojnr-acyn/Friday
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  notify-release:
    # Only once every other job has actually passed on main -- this marks
    # the commit as the recommended Friday version for every Friday
    # Host-managed tenant's update check, so a build/test failure must
    # never let a broken commit get marked. See friday-cloud-labs'
    # api/internal/fridayupdate (CreateReleaseFromCI) for what receives
    # this and FRIDAY_RELEASE_CI_TOKEN's own docs for the auth model.
    # ...and only once its images are published, so a marked release can
    # always be pulled.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Mark this commit as the recommended Friday release
        run: |
          curl -sf -X POST https://api.fridayhost.dev/friday-releases/ci \
            -H "Authorization: Bearer ${{ secrets.FRIDAY_RELEASE_CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\":\"${{ github.sha }}\"}"
