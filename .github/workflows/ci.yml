name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    services:
      # For the tests that need a real database (they skip without
      # KERNEL_TEST_DATABASE_URL), e.g. internal/auth/webauthn_db_test.go.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: kerneltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      KERNEL_TEST_DATABASE_URL: postgres://friday:friday@localhost:5432/kerneltest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [crm, invoicing, projects, inventory, web3, accounting, minions, fleets]
    services:
      # Each app's conftest.py (friday_common/testing.py) migrates its
      # own "<app>_test" schema on this server at session start -- no
      # separate migration step needed here, just a reachable Postgres.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: friday
          POSTGRES_PASSWORD: friday
          POSTGRES_DB: friday
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://friday:friday@localhost:5432/friday
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/${{ matrix.app }}/requirements.txt -r apps/${{ matrix.app }}/requirements-dev.txt
      - run: pytest apps/${{ matrix.app }}

  pos-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # web/src/apps/pos/PosPage.tsx imports the compiled WASM engine from
      # pos-engine/ (web/src/apps/pos/engine/ -- gitignored, never
      # committed, same reason apps/*'s own generated files aren't). A
      # checkout alone never has it; build it before anything in web/
      # tries to type-check or bundle against it.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the POS WASM engine
        working-directory: pos-engine
        run: wasm-pack build --target web --out-dir ../web/src/apps/pos/engine --out-name friday_pos_engine
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm install
      - working-directory: web
        run: npx tsc --noEmit
      - working-directory: web
        run: npm run build

  caddyfile:
    # deploy/Caddyfile, run by the Caddy a customer server runs, with and
    # without website rules shaped like the ones Friday Host writes into
    # firewall/web.caddy (friday-cloud-labs installs/remote_firewall.go).
    # No upstreams run, so a request the firewall lets through gets 502
    # and one it stops gets 403: that proves the rules run first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Website rules run before the app
        run: |
          mkdir -p fw
          # One argument per line of firewall/web.caddy.
          rules() { printf '%s\n' "$@" > fw/web.caddy; }
          code() {
            docker rm -f caddy >/dev/null 2>&1 || true
            docker run -d --name caddy --network host -e FRIDAY_DOMAIN=http://localhost:8080 \
              -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/fw:/etc/caddy/fw:ro" caddy:2.11-alpine >/dev/null
            for i in $(seq 1 20); do c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/kernel/health) && [ "$c" != 000 ] && break; sleep 1; done
            [ "$c" = "$1" ] || { echo "want $1, got $c"; docker logs caddy; exit 1; }
          }
          # No rules (no file, then a comment only): through to the app.
          code 502
          rules "# no rules"; code 502
          # Everyone blocked but Friday Host.
          rules "@fw_deny {" "client_ip 0.0.0.0/0 ::/0" "not client_ip 192.0.2.1/32" "}" \
            "respond @fw_deny \"Blocked by this site's firewall.\" 403"
          code 403
          # An allowlist that leaves this runner out, then one that lets it in.
          rules "@fw_outside not client_ip 203.0.113.0/24 192.0.2.1/32" \
            "respond @fw_outside \"Blocked by this site's firewall.\" 403"
          code 403
          rules "@fw_outside not client_ip 0.0.0.0/0 ::/0 192.0.2.1/32" \
            "respond @fw_outside \"Blocked by this site's firewall.\" 403"
          code 502

  publish:
    # Versioned images for Friday Host (docs/FRIDAYHOST-READINESS.md, 4E in
    # friday-cloud-labs): ghcr.io/okelojnr-acyn/friday-<app>:<full sha>
    # plus :latest. Friday Host pulls these instead of building on its own
    # box, and customer VPSes pull the exact same tested image. Only after
    # every test job passed on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [kernel, apps, pos-engine, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: friday-kernel, dockerfile: infra/kernel.Dockerfile, app: "", port: "" }
          - { image: friday-crm, dockerfile: infra/python-app.Dockerfile, app: crm, port: "8001" }
          - { image: friday-invoicing, dockerfile: infra/python-app.Dockerfile, app: invoicing, port: "8002" }
          - { image: friday-projects, dockerfile: infra/python-app.Dockerfile, app: projects, port: "8003" }
          - { image: friday-inventory, dockerfile: infra/python-app.Dockerfile, app: inventory, port: "8004" }
          - { image: friday-web3, dockerfile: infra/python-app.Dockerfile, app: web3, port: "8005" }
          - { image: friday-accounting, dockerfile: infra/python-app.Dockerfile, app: accounting, port: "8006" }
          - { image: friday-minions, dockerfile: infra/python-app.Dockerfile, app: minions, port: "8007" }
          - { image: friday-fleets, dockerfile: infra/python-app.Dockerfile, app: fleets, port: "8008" }
          - { image: friday-web, dockerfile: infra/web.Dockerfile, app: "", port: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP_NAME=${{ matrix.app }}
            APP_PORT=${{ matrix.port }}
          push: true
          tags: |
            ghcr.io/okelojnr-acyn/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/okelojnr-acyn/${{ matrix.image }}:latest
          # Links the package to this public repo (visibility follows it).
          labels: |
            org.opencontainers.image.source=https://github.com/okelojnr-acyn/Friday
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-smoke:
    # Runs deploy/compose.yml (what a customer server runs) from the
    # images just published, before the release is marked: every service
    # healthy, web and kernel answering through Caddy over HTTPS, the
    # runtime config carrying the domain, and bootstrap idempotent.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4
      - name: Write .env
        run: |
          {
            echo "FRIDAY_VERSION=${{ github.sha }}"
            echo "FRIDAY_DOMAIN=localhost"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "KERNEL_EVENTS_TOKEN=$(openssl rand -hex 32)"
          } > .env
      - run: docker compose -f compose.yml --env-file .env config -q
      - run: docker compose -f compose.yml --env-file .env up -d
      - name: Every service healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose -f compose.yml --env-file .env ps --format '{{.Service}} {{.Health}}' | awk '$2 != "" && $2 != "healthy"')
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          docker compose -f compose.yml --env-file .env ps
          [ -z "$unhealthy" ] || { echo "not healthy: $unhealthy"; docker compose -f compose.yml --env-file .env logs --tail 50; exit 1; }
      - name: Web and kernel through Caddy
        run: |
          for i in $(seq 1 30); do curl -skf https://localhost/kernel/healthz && break; sleep 2; done
          curl -skf https://localhost/kernel/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -skf https://localhost/ | grep -q '<div id="root">'
          curl -skf https://localhost/config.js | grep -q 'kernelUrl: "https://localhost/kernel"'
      - name: Bootstrap is idempotent
        run: |
          first=$(docker compose -f compose.yml --env-file .env exec -T kernel ./kernel bootstrap "Smoke Shop" smoke@example.com)
          again=$(docker compose -f compose.yml --env-file .env exec -T kernel ./kernel bootstrap "Smoke Shop" smoke@example.com)
          echo "$first / $again"
          [ -n "$first" ] && [ "$first" = "$again" ]
          echo "ORG_ID=$first" >> "$GITHUB_ENV"
      - name: Export an organisation
        run: |
          docker compose -f compose.yml --env-file .env exec -T kernel ./kernel export "$ORG_ID" > export.zip
          unzip -l export.zip | tee /dev/stderr | grep -q manifest.json
          unzip -p export.zip manifest.json | grep -q '"org_name": "Smoke Shop"'
          unzip -p export.zip people.csv | grep -q 'smoke@example.com,'
          unzip -l export.zip | grep -q 'core/memberships.csv'
          ! unzip -l export.zip | grep -q 'integration_credentials\|webauthn\|otp_codes\|guss_service'
          unzip -l export.zip | grep -c '\.csv$' 
      - name: Friday on its own Postgres (plan 2.4)
        timeout-minutes: 15
        # A separate PostgreSQL 14 with TLS on the compose network stands
        # in for a customer's database: dbcheck passes, every service
        # comes back healthy on it, Friday's tables land there, and the
        # backup dump reads it.
        run: |
          mkdir -p extcerts
          openssl req -new -x509 -days 1 -nodes -subj /CN=extdb -keyout extcerts/server.key -out extcerts/server.crt 2>/dev/null
          sudo chown 70:70 extcerts/server.key extcerts/server.crt && sudo chmod 600 extcerts/server.key
          EXTPW=$(openssl rand -hex 16)
          docker run -d --name extdb --network friday_default -e POSTGRES_USER=shop -e POSTGRES_PASSWORD=$EXTPW -e POSTGRES_DB=shop             -v "$PWD/extcerts:/certs:ro" postgres:14-alpine -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for i in $(seq 1 30); do docker exec extdb pg_isready -U shop && break; sleep 2; done
          echo "FRIDAY_DATABASE_URL=postgres://shop:$EXTPW@extdb:5432/shop?sslmode=require" >> .env
          docker compose -f compose.yml --env-file .env run --rm --no-deps -T kernel dbcheck | tee /dev/stderr | grep -q '^ok tls'
          docker compose -f compose.yml --env-file .env up -d
          for i in $(seq 1 60); do
            unhealthy=$(docker compose -f compose.yml --env-file .env ps --format '{{.Service}} {{.Health}}' | awk '$2 != "" && $2 != "healthy"')
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          [ -z "$unhealthy" ] || { echo "not healthy: $unhealthy"; exit 1; }
          org=$(docker compose -f compose.yml --env-file .env exec -T kernel ./kernel bootstrap "Own DB Shop" owndb@example.com)
          [ ${#org} -eq 36 ]
          docker exec extdb psql -U shop -d shop -tAc "SELECT name FROM core.orgs" | grep -q 'Own DB Shop'
          for s in crm invoicing projects inventory web3 accounting minions fleets; do
            docker exec extdb psql -U shop -d shop -tAc "SELECT count(*) FROM $s.schema_migrations" | grep -qv '^0$'
          done
          docker compose -f compose.yml --env-file .env exec -T postgres sh -c 'pg_dump -Fc "$FRIDAY_DATABASE_URL"' | wc -c | awk '$1 > 10000 {ok=1} END {exit !ok}'
      - if: failure()
        run: docker compose -f compose.yml --env-file .env logs --tail 100

  notify-release:
    # Only once every other job has actually passed on main -- this marks
    # the commit as the recommended Friday version for every Friday
    # Host-managed tenant's update check, so a build/test failure must
    # never let a broken commit get marked. See friday-cloud-labs'
    # api/internal/fridayupdate (CreateReleaseFromCI) for what receives
    # this and FRIDAY_RELEASE_CI_TOKEN's own docs for the auth model.
    # ...and only once its images are published, so a marked release can
    # always be pulled.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish, deploy-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Mark this commit as the recommended Friday release
        run: |
          curl -sf -X POST https://api.fridayhost.dev/friday-releases/ci \
            -H "Authorization: Bearer ${{ secrets.FRIDAY_RELEASE_CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"commit_sha\":\"${{ github.sha }}\"}"
