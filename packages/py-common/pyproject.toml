[project]
name = "friday-common"
version = "0.1.0"
description = "Shared auth, db, events, and resource-schema contract for Friday apps"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["friday_common*"]
